name: Docker PostGIS CI

on:
  push:
    tags:
      - v*

defaults:
  run:
    shell: bash

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-postgis-${{ github.ref }}
  cancel-in-progress: false

jobs:

  make-docker-images:
    strategy:
      fail-fast: false
      matrix:
        runner-platform: ['ubuntu-24.04', 'ubuntu-24.04-arm']
        postgres: [17, 18]
        postgis: ['3.6']
        variant: [default]
        include:
          - postgres: 16
            postgis: '3.5'
            variant: default
            runner-platform: 'ubuntu-24.04'
          - postgres: 16
            postgis: '3.5'
            variant: default
            runner-platform: 'ubuntu-24.04-arm'
          - postgres: 16
            postgis: '3.5'
            variant: alpine
            runner-platform: 'ubuntu-24.04'
          - postgres: 16
            postgis: '3.5'
            variant: alpine
            runner-platform: 'ubuntu-24.04-arm'
          - postgres: 16
            postgis: master
            variant: default
            runner-platform: 'ubuntu-24.04'
          - postgres: 16
            postgis: master
            variant: default
            runner-platform: 'ubuntu-24.04-arm'
          - postgres: 17
            postgis: master
            variant: default
            runner-platform: 'ubuntu-24.04'
          - postgres: 17
            postgis: master
            variant: default
            runner-platform: 'ubuntu-24.04-arm'
          - postgres: 18
            postgis: master
            variant: default
            runner-platform: 'ubuntu-24.04'
          - postgres: 18
            postgis: master
            variant: default
            runner-platform: 'ubuntu-24.04-arm'
          - postgres: 17
            postgis: '3.6'
            variant: alpine
            runner-platform: 'ubuntu-24.04'
          - postgres: 17
            postgis: '3.6'
            variant: alpine
            runner-platform: 'ubuntu-24.04-arm'
          - postgres: 18
            postgis: '3.6'
            variant: alpine
            runner-platform: 'ubuntu-24.04'
          - postgres: 18
            postgis: '3.6'
            variant: alpine
            runner-platform: 'ubuntu-24.04-arm'

    name: ${{ matrix.postgres }}-${{ matrix.postgis }}-${{ matrix.variant }} ${{ matrix.runner-platform }} - Build Docker image
    runs-on: ${{ matrix.runner-platform }}
    continue-on-error: ${{ matrix.postgis == 'master' }}
    env:
      VERSION: ${{ matrix.postgres }}-${{ matrix.postgis }}
      VARIANT: ${{ matrix.variant }}
      DOCKERFILE_PATH: ${{ matrix.variant == 'default' && format('./{0}-{1}', matrix.postgres, matrix.postgis) || format('./{0}-{1}/{2}', matrix.postgres, matrix.postgis, matrix.variant) }}
      DOCKER_TAG: ${{ matrix.variant == 'default' && format('{0}-{1}', matrix.postgres, matrix.postgis) || format('{0}-{1}-{2}', matrix.postgres, matrix.postgis, matrix.variant) }}
      PLATFORM: ${{ matrix.runner-platform == 'ubuntu-24.04-arm' && 'linux/arm64' || 'linux/amd64' }}
      ARCH_SUFFIX: ${{ matrix.runner-platform == 'ubuntu-24.04-arm' && 'arm64' || 'amd64' }}
      DOCKER_APT_PKG_VER: '5:29.2.1-1~ubuntu.24.04~noble'

    steps:
    - name: Checkout source
      uses: actions/checkout@v6

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Login to GHCR
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push ${{ env.VERSION }} ${{ env.VARIANT }} ${{ env.PLATFORM }} to GHCR
      uses: docker/build-push-action@v7
      with:
        context: ${{ env.DOCKERFILE_PATH }}
        file: ${{ env.DOCKERFILE_PATH }}/Dockerfile
        platforms: ${{ env.PLATFORM }}
        push: true
        tags: |
            ghcr.io/${{ github.repository_owner }}/postgis:${{ env.DOCKER_TAG }}-${{ env.ARCH_SUFFIX }}
        cache-from: type=gha,scope=${{ env.DOCKER_TAG }}-${{ env.ARCH_SUFFIX }}
        cache-to: type=gha,mode=max,scope=${{ env.DOCKER_TAG }}-${{ env.ARCH_SUFFIX }}

  create-manifests:
    needs: make-docker-images
    strategy:
      fail-fast: false
      matrix:
        postgres: [17, 18]
        postgis: ['3.6']
        variant: [default]
        include:
          - postgres: 16
            postgis: '3.5'
            variant: default
          - postgres: 16
            postgis: '3.5'
            variant: alpine
          - postgres: 16
            postgis: master
            variant: default
          - postgres: 17
            postgis: master
            variant: default
          - postgres: 18
            postgis: master
            variant: default
          - postgres: 17
            postgis: '3.6'
            variant: alpine
          - postgres: 18
            postgis: '3.6'
            variant: alpine

    name: ${{ matrix.postgres }}-${{ matrix.postgis }}-${{ matrix.variant }} - Create multi-arch manifest
    runs-on: ubuntu-24.04
    continue-on-error: ${{ matrix.postgis == 'master' }}
    env:
      DOCKER_TAG: ${{ matrix.variant == 'default' && format('{0}-{1}', matrix.postgres, matrix.postgis) || format('{0}-{1}-{2}', matrix.postgres, matrix.postgis, matrix.variant) }}

    steps:
    - name: Login to GHCR
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Create and push multi-arch manifest
      run: |
        tags=(--tag ghcr.io/${{ github.repository_owner }}/postgis:${{ env.DOCKER_TAG }})
        if [ "${{ matrix.postgres }}" = "18" ] && [ "${{ matrix.postgis }}" = "master" ] && [ "${{ matrix.variant }}" = "default" ]; then
          tags+=(--tag ghcr.io/${{ github.repository_owner }}/postgis:latest)
        fi

        docker buildx imagetools create \
          "${tags[@]}" \
          ghcr.io/${{ github.repository_owner }}/postgis:${{ env.DOCKER_TAG }}-amd64 \
          ghcr.io/${{ github.repository_owner }}/postgis:${{ env.DOCKER_TAG }}-arm64
